<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추천해조 · 랜덤 음악 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1B3A; --bg:#F3E6D0; --paper:#FFFDF8; --cream:#FFF6E6;
  --pink:#F0356B; --yellow:#FFC93C; --mint:#35D0BA; --violet:#7B61FF;
  --muted:#4B4870; --track:#E9E1CF; --star-off:#E2D9C6;
  --display:'Black Han Sans','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.5;padding-bottom:140px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid var(--violet);outline-offset:2px}
[hidden]{display:none!important}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px clamp(16px,4vw,48px)}
.logo{font-family:var(--display);font-size:32px;line-height:1.2;background:var(--yellow);border:3px solid var(--ink);padding:2px 18px;border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.tabs{display:flex;gap:8px}
.tabs button{background:none;border:3px solid transparent;padding:6px 20px;border-radius:999px;font-weight:700;font-size:1.05rem}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--cream)}

main{max-width:1040px;margin:0 auto;padding:8px clamp(16px,4vw,32px) 0}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.2}
h1{font-size:clamp(28px,5vw,44px);text-align:center}
h2{font-size:clamp(24px,4vw,34px)}

/* 공통 부품 */
.btn{border:3px solid var(--ink);background:var(--paper);border-radius:14px;padding:10px 22px;font-weight:700;font-size:1.05rem;box-shadow:4px 4px 0 var(--ink)}
a.btn{display:inline-block;color:var(--ink);text-decoration:none}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.primary{background:var(--yellow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 14px;font-size:.95rem;box-shadow:3px 3px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--ink);background:var(--paper);border-radius:999px;padding:4px 18px;font-weight:700;font-size:.95rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.tag{display:inline-block;border:3px solid var(--ink);background:var(--cream);border-radius:999px;padding:0 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.muted{color:var(--muted)}
.art{aspect-ratio:1/1;border-radius:14px;border:3px solid var(--ink);background:linear-gradient(135deg,var(--violet),var(--pink))}
.stars{display:inline-flex;align-items:center;gap:2px}
.star{display:inline-flex;background:none;border:0;padding:0}
.star svg{fill:var(--star-off);display:block}
.star.on svg{fill:var(--pink)}
button.star:hover svg{fill:var(--pink);opacity:.7}

/* 랜덤 화면 */
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:8px}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin:28px 0 20px;padding-top:12px}
@media(max-width:760px){.picks{grid-template-columns:1fr}}
.pick{border:4px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:6px 6px 0 var(--ink);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .12s}
.pick .name{font-size:1.2rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.pick .tag{align-self:flex-start;min-width:84px;text-align:center}
button.pick:hover{transform:translateY(-4px)}
.pick.selected{border:6px solid var(--pink);background:var(--cream);transform:translateY(-12px)}
.pick .badge{position:absolute;right:14px;top:14px;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:0 14px;font-weight:700}
.pick.back{align-items:center;justify-content:center;min-height:280px;font-family:var(--display);font-size:100px;line-height:1;cursor:default}
.pick.back:nth-child(1){background:var(--violet);color:var(--cream);transform:rotate(-3deg)}
.pick.back:nth-child(2){background:var(--yellow)}
.pick.back:nth-child(3){background:var(--mint);transform:rotate(3deg)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.empty{border:4px dashed var(--ink);border-radius:24px;padding:28px;text-align:center;background:var(--paper);margin:24px 0}
.empty p{margin:0 0 14px}
.empty .actions{margin-top:6px}

/* 플레이리스트 화면 */
.list-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px}
.rule{margin:0 0 14px;font-size:.95rem}
.rows{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.row{display:grid;grid-template-columns:44px 56px minmax(0,1fr) auto auto auto auto;gap:12px;align-items:center;border:3px solid var(--ink);background:var(--paper);border-radius:16px;padding:10px 14px}
.row.playing{background:var(--cream);border-width:4px}
.row .rank{font-family:var(--display);font-size:30px;text-align:center}
.row .row-art{width:56px}
.row .t{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.row .plays{font-weight:700;min-width:56px;text-align:right}
.row .ctl{display:flex;gap:8px}
.row .excluded{font-size:.8rem;color:var(--muted)}
@media(max-width:760px){
  .row{grid-template-columns:36px 48px minmax(0,1fr);}
  .row .row-art{width:48px}
  .row .tag,.row .stars,.row .plays,.row .ctl{grid-column:3}
}

/* 재생 화면 */
.player-view{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:36px;align-items:center;margin-top:12px}
@media(max-width:820px){.player-view{grid-template-columns:1fr}}
.player-view .art{width:100%;box-shadow:8px 8px 0 var(--ink);border-width:4px;border-radius:28px}
.player-info{display:flex;flex-direction:column;gap:16px}
.player-info .title{font-family:var(--display);font-size:clamp(28px,4.5vw,48px);line-height:1.2;overflow-wrap:anywhere}
.player-info .meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:1.2rem}
.rate{display:flex;align-items:center;gap:8px;font-weight:700}
.progress{display:flex;align-items:center;gap:10px}
.progress input{flex:1}
.progress span{font-variant-numeric:tabular-nums;min-width:44px;font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.round{width:84px;height:84px;border-radius:50%;border:4px solid var(--ink);background:var(--yellow);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;padding:0}
.round svg{width:36px;height:36px;fill:var(--ink)}
.back-link{background:none;border:0;font-weight:700;padding:0;text-decoration:underline}

input[type=range]{accent-color:var(--pink);width:100%;min-width:0}

/* 하단 재생 바 */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-top:4px solid var(--ink);padding:10px clamp(12px,3vw,32px);display:grid;grid-template-columns:auto minmax(100px,260px) minmax(120px,1fr) auto auto;gap:14px;align-items:center;z-index:20}
.bar .info{background:none;border:0;padding:0;text-align:left;min-width:0}
.bar .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.9rem}
.bar .time{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);white-space:nowrap}
.bar .round{width:56px;height:56px;border-width:3px;box-shadow:3px 3px 0 var(--ink)}
.bar .round svg{width:26px;height:26px}
@media(max-width:640px){.bar{grid-template-columns:auto minmax(0,1fr) auto}.bar .progress-wrap,.bar .time{display:none}}
body[data-view="player"] .bar{display:none}

/* 유튜브 영상: 재생 바 썸네일 자리에 겹쳐서 표시 (위치는 JS의 placeDock이 맞춰 줌) */
.dock{position:fixed;left:0;top:0;width:112px;height:63px;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#000;z-index:25}
.dock:not(.on){opacity:0;pointer-events:none}
.dock iframe{width:100%;height:100%;display:block;border:0}
.bar .bar-art{width:112px;aspect-ratio:16/9}
body.has-song{padding-bottom:110px}

/* 곡 추가 창 */
dialog{border:4px solid var(--ink);border-radius:24px;padding:0;background:var(--paper);color:var(--ink);box-shadow:10px 10px 0 var(--ink);width:min(560px,92vw)}
dialog::backdrop{background:rgba(30,27,58,.5)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.dlg h2{font-size:30px}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700}
.field input[type=text],.field input[type=url]{width:100%;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-weight:400;background:#fff;color:var(--ink)}
.field small{font-weight:400;color:var(--muted)}
.genre-add{display:flex;gap:8px}
.genre-add input{flex:1;min-width:0;border:3px dashed var(--ink);border-radius:999px;padding:4px 16px;font:inherit;background:var(--cream);color:var(--ink)}
.dlg-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:4px}

/* 알림 */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 22px;border-radius:999px;font-weight:700;z-index:50;max-width:92vw;text-align:center;box-shadow:4px 4px 0 var(--pink)}
.toast:empty{display:none}
</style>
</head>
<body data-view="random">

<header class="top">
  <div class="logo">추천해조</div>
  <nav class="tabs" aria-label="화면 이동">
    <button type="button" data-go="random">랜덤 뽑기</button>
    <button type="button" data-go="list">내 플레이리스트</button>
  </nav>
</header>

<main>
  <!-- 1. 랜덤 뽑기 (메인) -->
  <section id="view-random" aria-labelledby="randomTitle">
    <div class="hero">
      <h1 id="randomTitle">오늘은 뭘 들을까?</h1>
      <div class="chips" id="randomGenres" role="group" aria-label="장르 선택"></div>
      <p class="muted" id="poolInfo" style="margin:0"></p>
    </div>
    <div class="picks" id="picks" aria-live="polite"></div>
    <div class="actions" id="randomActions">
      <button type="button" class="btn" id="drawBtn">곡 3개 뽑기</button>
      <button type="button" class="btn primary" id="pickBtn" disabled>이 곡 선택하고 재생</button>
    </div>
    <div id="randomEmpty"></div>
    <p class="muted" style="text-align:center;margin-top:20px;font-size:.95rem">한 번 고른 곡은 다음 뽑기에서 빠져요. 고르지 않은 곡은 후보에 그대로 남아요.</p>
  </section>

  <!-- 2. 내 플레이리스트 -->
  <section id="view-list" aria-labelledby="listTitle" hidden>
    <div class="list-head">
      <h2 id="listTitle">내 플레이리스트 <span class="muted" id="listCount" style="font-size:.6em"></span></h2>
      <button type="button" class="btn primary" id="addBtn">+ 곡 추가</button>
    </div>
    <p class="rule muted">별점이 높은 순으로 정렬하고, 별점이 같으면 재생 수가 많은 곡이 위로 가요.</p>
    <div class="chips" id="listGenres" role="group" aria-label="장르 필터"></div>
    <div class="rows" id="rows"></div>
    <div id="listEmpty"></div>
  </section>

  <!-- 3. 재생 화면 -->
  <section id="view-player" aria-label="재생 화면" hidden>
    <button type="button" class="back-link" id="backBtn">← 돌아가기</button>
    <div id="playerBody"></div>
  </section>
</main>

<!-- 하단 재생 바 -->
<footer class="bar" id="bar" aria-label="재생 바">
  <div class="art bar-art" id="barArt"></div>
  <button type="button" class="info" id="barInfo" aria-label="재생 화면 열기">
    <b id="barTitle">재생 중인 곡이 없어요</b>
    <small id="barArtist">곡을 뽑아서 들어보세요</small>
  </button>
  <div class="progress-wrap"><input type="range" id="barSeek" min="0" max="100" value="0" step="1" aria-label="재생 위치" disabled></div>
  <span class="time" id="barTime">0:00 / 0:00</span>
  <button type="button" class="round" id="barPlay" data-play-btn aria-label="재생" disabled></button>
</footer>

<!-- 유튜브 영상 -->
<div class="dock" id="dock"><div id="yt"></div></div>

<!-- 곡 추가 창 -->
<dialog id="addDialog" aria-labelledby="addTitle">
  <form class="dlg" id="addForm" method="dialog" autocomplete="off">
    <h2 id="addTitle">곡 추가</h2>
    <label class="field">유튜브 공유 링크
      <input type="url" id="fLink" placeholder="https://youtu.be/..." required>
      <small id="fLinkHint">유튜브에서 공유한 링크를 붙여넣으면 제목을 자동으로 채워요.</small>
    </label>
    <label class="field">곡 제목
      <input type="text" id="fTitle" maxlength="80" required>
    </label>
    <label class="field">가수
      <input type="text" id="fArtist" maxlength="60">
    </label>
    <div class="field">장르 선택
      <div class="chips" id="fGenres" role="group" aria-label="장르"></div>
      <div class="genre-add">
        <input type="text" id="fNewGenre" maxlength="12" placeholder="+ 장르 추가 (예: OST)" aria-label="새 장르 이름">
        <button type="button" class="btn small" id="fNewGenreBtn">추가</button>
      </div>
    </div>
    <div class="field">별점 (선택)
      <div id="fStars"></div>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="fCancel">취소</button>
      <button type="submit" class="btn primary">저장하기</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- 데이터 ---------- */
const KEY = 'chucheonhaejo.v1';
const DEFAULT_GENRES = ['발라드', '힙합', '록', '댄스', '인디'];
// 예시 곡 (재생이 안 되는 곡은 삭제하고 직접 추가하세요)
const SAMPLE = [
  { id: 'fJ9rUzIMcZQ', title: 'Bohemian Rhapsody', artist: 'Queen', genre: '록', rating: 5 },
  { id: 'YQHsXMglC9A', title: 'Hello', artist: 'Adele', genre: '발라드', rating: 4 },
  { id: 'RgKAFK5djSk', title: 'See You Again', artist: 'Wiz Khalifa ft. Charlie Puth', genre: '힙합', rating: 4 },
  { id: '9bZkp7q19f0', title: '강남스타일', artist: 'PSY', genre: '댄스', rating: 3 },
  { id: 'dQw4w9WgXcQ', title: 'Never Gonna Give You Up', artist: 'Rick Astley', genre: '댄스', rating: 3 }
];

let data = { songs: [], customGenres: [] };
const ui = { view: 'random', prevView: 'random', filterRandom: '전체', filterList: '전체', draw: [], picked: null, current: null, playing: false };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.songs)) data.songs = d.songs.filter(s => s && /^[\w-]{11}$/.test(s.id));
    if (d && Array.isArray(d.customGenres)) data.customGenres = d.customGenres.filter(g => typeof g === 'string');
  } catch (e) { /* 저장소를 못 쓰면 이번 방문에만 기억해요 */ }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* 무시 */ }
}

/* ---------- 도우미 ---------- */
const $ = (s) => document.querySelector(s);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') n.className = v; else n.setAttribute(k, v);
  }
  n.append(...kids);
  return n;
}
function genres() { return [...DEFAULT_GENRES, ...data.customGenres]; }
function songById(id) { return data.songs.find(s => s.id === id); }
function sorted(list) { return [...list].sort((a, b) => b.rating - a.rating || b.plays - a.plays || a.addedAt - b.addedAt); }
function artBg(id) { return `url("https://i.ytimg.com/vi/${id}/mqdefault.jpg") center/cover no-repeat, linear-gradient(135deg,#7B61FF,#F0356B)`; }
function fmt(sec) { sec = Math.max(0, Math.floor(sec || 0)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.textContent = ''; }, 3200);
}

const STAR = '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function stars(rating, onSet) {
  const wrap = el('div', { class: 'stars', role: 'group', 'aria-label': `별점 ${rating}점` });
  for (let i = 1; i <= 5; i++) {
    const on = i <= rating;
    const n = onSet
      ? el('button', { type: 'button', class: 'star' + (on ? ' on' : ''), 'aria-label': `${i}점`, 'aria-pressed': String(on) })
      : el('span', { class: 'star' + (on ? ' on' : '') });
    n.innerHTML = STAR;
    if (onSet) n.addEventListener('click', () => onSet(i === rating ? 0 : i));
    wrap.append(n);
  }
  return wrap;
}

function renderChips(box, selected, onPick, withAll) {
  box.replaceChildren();
  const names = withAll ? ['전체', ...genres()] : genres();
  names.forEach(g => {
    const b = el('button', { type: 'button', class: 'chip', 'aria-pressed': String(g === selected) }, g);
    b.addEventListener('click', () => onPick(g));
    box.append(b);
  });
}

function parseYouTubeId(input) {
  const text = String(input || '').trim();
  try {
    const u = new URL(text);
    const host = u.hostname.replace(/^(www|m|music)\./, '');
    let id = null;
    if (host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v');
      else { const m = u.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{11})/); if (m) id = m[2]; }
    }
    if (id && /^[\w-]{11}$/.test(id)) return id;
  } catch (e) { /* URL이 아니면 아래에서 확인 */ }
  return /^[\w-]{11}$/.test(text) ? text : null;
}

/* ---------- 화면 이동 ---------- */
function go(view) {
  if (view === 'player' && ui.view !== 'player') ui.prevView = ui.view;
  ui.view = view;
  document.body.dataset.view = view;
  $('#view-random').hidden = view !== 'random';
  $('#view-list').hidden = view !== 'list';
  $('#view-player').hidden = view !== 'player';
  document.querySelectorAll('.tabs button').forEach(b => {
    if (b.dataset.go === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (view === 'random') renderRandom();
  if (view === 'list') renderList();
  if (view === 'player') renderPlayer();
  window.scrollTo(0, 0);
}

/* ---------- 랜덤 뽑기 ---------- */
function pool() {
  return data.songs.filter(s => !s.excluded && (ui.filterRandom === '전체' || s.genre === ui.filterRandom));
}
function drawThree() {
  ui.draw = shuffle(pool()).slice(0, 3).map(s => s.id);
  ui.picked = null;
  renderRandom();
}
function chooseSong(id) {
  const s = songById(id); if (!s) return;
  s.excluded = true;
  ui.draw = []; ui.picked = null;
  save();
  playSong(id);
  renderRandom();
  toast(`"${s.title}"을(를) 골랐어요. 이 곡은 다음 뽑기에서 빠져요.`);
}

function renderRandom() {
  renderChips($('#randomGenres'), ui.filterRandom, g => { ui.filterRandom = g; ui.draw = []; ui.picked = null; renderRandom(); }, true);
  const p = pool();
  $('#poolInfo').textContent = `남은 후보 ${p.length}곡 · 전체 ${data.songs.length}곡`;

  const box = $('#picks'); box.replaceChildren();
  if (ui.draw.length) {
    ui.draw.forEach(id => {
      const s = songById(id); if (!s) return;
      const art = el('div', { class: 'art' }); art.style.background = artBg(s.id);
      const card = el('button', { type: 'button', class: 'pick' + (ui.picked === id ? ' selected' : ''), 'aria-pressed': String(ui.picked === id) },
        art, el('span', { class: 'name' }, s.title), el('span', { class: 'muted' }, s.artist || '알 수 없음'), el('span', { class: 'tag' }, s.genre));
      if (ui.picked === id) card.append(el('span', { class: 'badge' }, '선택!'));
      card.addEventListener('click', () => { ui.picked = id; renderRandom(); });
      box.append(card);
    });
  } else {
    for (let i = 0; i < 3; i++) box.append(el('div', { class: 'pick back', 'aria-hidden': 'true' }, '?'));
  }

  $('#drawBtn').textContent = ui.draw.length ? '다시 뽑기' : '곡 3개 뽑기';
  $('#drawBtn').disabled = p.length === 0;
  $('#pickBtn').disabled = !ui.picked;

  // 안내 메시지
  const empty = $('#randomEmpty'); empty.replaceChildren();
  if (data.songs.length === 0) {
    $('#randomActions').hidden = true;
    empty.append(emptyBox('아직 곡이 없어요. 유튜브 공유 링크로 곡을 추가해 보세요.',
      ['+ 곡 추가', openAdd, true], ['예시 곡 넣어보기', addSamples, false]));
  } else if (p.length === 0) {
    $('#randomActions').hidden = false;
    const all = ui.filterRandom === '전체';
    empty.append(emptyBox(all ? '모든 곡을 한 번씩 골랐어요!' : `"${ui.filterRandom}" 장르에는 남은 곡이 없어요.`,
      ['제외된 곡 다시 넣기', resetPool, true]));
  } else {
    $('#randomActions').hidden = false;
  }
}
function emptyBox(text, ...btns) {
  const box = el('div', { class: 'empty' }, el('p', {}, text));
  const row = el('div', { class: 'actions' });
  btns.forEach(([label, fn, primary]) => {
    const b = el('button', { type: 'button', class: 'btn' + (primary ? ' primary' : '') }, label);
    b.addEventListener('click', fn); row.append(b);
  });
  box.append(row); return box;
}
function resetPool() {
  data.songs.forEach(s => { s.excluded = false; });
  save(); ui.draw = []; ui.picked = null; renderRandom(); toast('제외된 곡을 모두 후보에 다시 넣었어요.');
}
function addSamples() {
  let added = 0;
  SAMPLE.forEach(x => {
    if (!songById(x.id)) { data.songs.push({ ...x, plays: 0, excluded: false, addedAt: Date.now() + added }); added++; }
  });
  save(); renderRandom(); renderList(); toast(`예시 곡 ${added}곡을 넣었어요.`);
}

/* ---------- 내 플레이리스트 ---------- */
function renderList() {
  renderChips($('#listGenres'), ui.filterList, g => { ui.filterList = g; renderList(); }, true);
  $('#listCount').textContent = `${data.songs.length}곡`;
  const list = sorted(data.songs.filter(s => ui.filterList === '전체' || s.genre === ui.filterList));
  const rows = $('#rows'); rows.replaceChildren();
  list.forEach((s, i) => {
    const art = el('div', { class: 'art row-art' }); art.style.background = artBg(s.id);
    const info = el('div', {}, el('div', { class: 't' }, s.title), el('div', { class: 'muted' }, s.artist || '알 수 없음'));
    if (s.excluded) info.append(el('div', { class: 'excluded' }, '이미 뽑아서 랜덤 후보에서 빠진 곡'));
    const playBtn = el('button', { type: 'button', class: 'btn small', 'aria-label': `${s.title} 재생` }, '재생');
    playBtn.addEventListener('click', () => playSong(s.id));
    const delBtn = el('button', { type: 'button', class: 'btn small', 'aria-label': `${s.title} 삭제` }, '삭제');
    delBtn.addEventListener('click', () => {
      if (!confirm(`"${s.title}"을(를) 삭제할까요?`)) return;
      data.songs = data.songs.filter(x => x.id !== s.id);
      ui.draw = ui.draw.filter(x => x !== s.id);
      if (ui.picked === s.id) ui.picked = null;
      save(); renderList(); toast('삭제했어요.');
    });
    rows.append(el('div', { class: 'row' + (ui.current === s.id ? ' playing' : '') },
      el('div', { class: 'rank' }, String(i + 1)), art, info,
      el('span', { class: 'tag' }, s.genre),
      stars(s.rating, n => setRating(s.id, n)),
      el('span', { class: 'plays' }, `${s.plays}회`),
      el('div', { class: 'ctl' }, playBtn, delBtn)));
  });
  const empty = $('#listEmpty'); empty.replaceChildren();
  if (data.songs.length === 0) {
    empty.append(emptyBox('아직 곡이 없어요. 유튜브 공유 링크로 곡을 추가해 보세요.',
      ['+ 곡 추가', openAdd, true], ['예시 곡 넣어보기', addSamples, false]));
  } else if (list.length === 0) {
    empty.append(emptyBox(`"${ui.filterList}" 장르에는 아직 곡이 없어요.`));
  }
}
function setRating(id, n) {
  const s = songById(id); if (!s) return;
  s.rating = n; save(); renderList(); if (ui.view === 'player') renderPlayer();
}

/* ---------- 재생 (유튜브 IFrame API) ---------- */
let yt = null, ytReady = false, pendingId = null, dragging = false;

function loadYouTubeApi() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => toast('유튜브 플레이어를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
  document.head.append(s);
}
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('yt', {
    width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => { ytReady = true; if (pendingId) { yt.loadVideoById(pendingId); pendingId = null; } },
      onStateChange: e => {
        ui.playing = e.data === 1; renderPlayIcons();
        if (e.data === 0) onEnded();
      },
      onError: () => {
        const s = songById(ui.current);
        toast(`"${s ? s.title : '이 곡'}"은(는) 재생할 수 없어요. 파일로 열었다면 주소가 http로 시작하는 곳에서 열어 주세요.`);
      }
    }
  });
};

function playSong(id) {
  const s = songById(id); if (!s) return;
  ui.current = id; s.plays += 1; save();
  $('#dock').classList.add('on');
  document.body.classList.add('has-song');
  if (ytReady) yt.loadVideoById(id); else pendingId = id;
  renderBar(); if (ui.view === 'player') renderPlayer(); if (ui.view === 'list') renderList();
}
function togglePlay() {
  if (!ytReady || !ui.current) return;
  if (yt.getPlayerState() === 1) yt.pauseVideo(); else yt.playVideo();
}
function onEnded() {
  toast('곡이 끝났어요. 다음 3곡을 뽑았어요!');
  go('random');
  if (pool().length) drawThree();
}

function renderPlayIcons() {
  document.querySelectorAll('[data-play-btn]').forEach(b => {
    b.innerHTML = ui.playing ? ICON_PAUSE : ICON_PLAY;
    b.setAttribute('aria-label', ui.playing ? '일시정지' : '재생');
  });
}
function placeDock() {
  const d = $('#dock');
  const t = ui.view === 'player' ? document.querySelector('#playerBody .art') : $('#barArt');
  if (!d || !t) return;
  const r = t.getBoundingClientRect();
  if (!r.width) return;
  d.style.left = r.left + 'px'; d.style.top = r.top + 'px';
  d.style.width = r.width + 'px'; d.style.height = r.height + 'px';
  d.style.borderRadius = getComputedStyle(t).borderRadius;
}
window.addEventListener('resize', placeDock);
window.addEventListener('scroll', placeDock, { passive: true });

function renderBar() {
  const s = songById(ui.current);
  $('#barArt').style.background = s ? artBg(s.id) : '';
  $('#barTitle').textContent = s ? s.title : '재생 중인 곡이 없어요';
  $('#barArtist').textContent = s ? (s.artist || '알 수 없음') : '곡을 뽑아서 들어보세요';
  $('#barPlay').disabled = !s; $('#barSeek').disabled = !s;
  renderPlayIcons();
  placeDock();
}
function renderPlayer() {
  const body = $('#playerBody'); body.replaceChildren();
  const s = songById(ui.current);
  if (!s) { body.append(emptyBox('재생 중인 곡이 없어요.', ['랜덤 뽑기로 가기', () => go('random'), true])); return; }
  const art = el('div', { class: 'art' }); art.style.background = artBg(s.id);
  const play = el('button', { type: 'button', class: 'round', 'data-play-btn': '' });
  play.addEventListener('click', togglePlay);
  const seek = el('input', { type: 'range', id: 'pSeek', min: '0', max: '100', value: '0', step: '1', 'aria-label': '재생 위치' });
  bindSeek(seek);
  const next = el('button', { type: 'button', class: 'btn' }, '다음 3곡 뽑기');
  next.addEventListener('click', () => { go('random'); if (pool().length) drawThree(); });
  const link = el('a', { class: 'btn', href: `https://www.youtube.com/watch?v=${s.id}`, target: '_blank', rel: 'noopener noreferrer' }, '유튜브에서 열기');
  body.append(el('div', { class: 'player-view' }, art,
    el('div', { class: 'player-info' },
      el('div', { class: 'title' }, s.title),
      el('div', { class: 'meta' }, el('span', { class: 'muted' }, s.artist || '알 수 없음'), el('span', { class: 'tag' }, s.genre), el('span', { class: 'muted' }, `재생 ${s.plays}회`)),
      el('div', { class: 'rate' }, '내 별점', stars(s.rating, n => setRating(s.id, n))),
      el('div', { class: 'progress' }, el('span', { id: 'pCur' }, '0:00'), seek, el('span', { id: 'pDur' }, '0:00')),
      el('div', { class: 'controls' }, play, next, link))));
  renderPlayIcons();
}
function bindSeek(input) {
  input.addEventListener('input', () => { dragging = true; });
  input.addEventListener('change', () => {
    dragging = false;
    if (ytReady && ui.current) yt.seekTo((Number(input.value) / 100) * yt.getDuration(), true);
  });
}

function tick() {
  if (!ytReady || !ui.current || typeof yt.getCurrentTime !== 'function') return;
  const cur = yt.getCurrentTime() || 0, dur = yt.getDuration() || 0;
  const pct = dur ? (cur / dur) * 100 : 0;
  if (!dragging) {
    $('#barSeek').value = pct;
    const ps = $('#pSeek'); if (ps) ps.value = pct;
  }
  $('#barTime').textContent = `${fmt(cur)} / ${fmt(dur)}`;
  const pc = $('#pCur'), pd = $('#pDur');
  if (pc) pc.textContent = fmt(cur); if (pd) pd.textContent = fmt(dur);
}

/* ---------- 곡 추가 ---------- */
const form = { genre: '발라드', rating: 0 };
function openAdd() {
  $('#addForm').reset();
  form.genre = DEFAULT_GENRES[0]; form.rating = 0;
  $('#fLinkHint').textContent = '유튜브에서 공유한 링크를 붙여넣으면 제목을 자동으로 채워요.';
  renderFormGenres(); renderFormStars();
  $('#addDialog').showModal();
  $('#fLink').focus();
}
function renderFormGenres() {
  renderChips($('#fGenres'), form.genre, g => { form.genre = g; renderFormGenres(); }, false);
}
function renderFormStars() {
  const box = $('#fStars'); box.replaceChildren(stars(form.rating, n => { form.rating = n; renderFormStars(); }));
}
async function fetchInfo(id) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 6000);
  try {
    const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id), { signal: ctrl.signal });
    if (!r.ok) throw new Error('oembed');
    return await r.json();
  } catch (e) { return null; } finally { clearTimeout(t); }
}
async function onLinkChange() {
  const id = parseYouTubeId($('#fLink').value);
  const hint = $('#fLinkHint');
  if (!$('#fLink').value.trim()) return;
  if (!id) { hint.textContent = '유튜브 링크를 알아볼 수 없어요. 공유 링크를 다시 확인해 주세요.'; return; }
  hint.textContent = '곡 정보를 가져오는 중…';
  const info = await fetchInfo(id);
  if (info) {
    if (!$('#fTitle').value) $('#fTitle').value = String(info.title || '').slice(0, 80);
    if (!$('#fArtist').value) $('#fArtist').value = String(info.author_name || '').replace(/ - Topic$/, '').slice(0, 60);
    hint.textContent = '제목과 가수는 자유롭게 고칠 수 있어요.';
  } else {
    hint.textContent = '자동으로 가져오지 못했어요. 제목과 가수를 직접 적어 주세요.';
  }
}
function addGenre() {
  const input = $('#fNewGenre'); const name = input.value.trim();
  if (!name) return;
  if (genres().includes(name)) { form.genre = name; renderFormGenres(); input.value = ''; toast('이미 있는 장르예요. 선택해 두었어요.'); return; }
  data.customGenres.push(name); save();
  form.genre = name; input.value = '';
  renderFormGenres(); toast(`"${name}" 장르를 추가했어요.`);
}
function onSubmit(e) {
  e.preventDefault();
  const id = parseYouTubeId($('#fLink').value);
  const title = $('#fTitle').value.trim();
  if (!id) { toast('유튜브 공유 링크를 확인해 주세요.'); return; }
  if (!title) { toast('곡 제목을 적어 주세요.'); return; }
  if (songById(id)) { toast('이미 플레이리스트에 있는 곡이에요.'); return; }
  data.songs.push({ id, title, artist: $('#fArtist').value.trim(), genre: form.genre, rating: form.rating, plays: 0, excluded: false, addedAt: Date.now() });
  save();
  $('#addDialog').close();
  renderRandom(); renderList();
  toast(`"${title}"을(를) ${form.genre} 장르로 저장했어요.`);
}

/* ---------- 시작 ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
$('#drawBtn').addEventListener('click', drawThree);
$('#pickBtn').addEventListener('click', () => { if (ui.picked) chooseSong(ui.picked); });
$('#addBtn').addEventListener('click', openAdd);
$('#backBtn').addEventListener('click', () => go(ui.prevView || 'random'));
$('#barInfo').addEventListener('click', () => { if (ui.current) go('player'); });
$('#barPlay').addEventListener('click', togglePlay);
bindSeek($('#barSeek'));
$('#fLink').addEventListener('change', onLinkChange);
$('#fLink').addEventListener('paste', () => setTimeout(onLinkChange, 0));
$('#fNewGenreBtn').addEventListener('click', addGenre);
$('#fNewGenre').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addGenre(); } });
$('#fCancel').addEventListener('click', () => $('#addDialog').close());
$('#addForm').addEventListener('submit', onSubmit);

load();
renderBar();
go('random');
loadYouTubeApi();
setInterval(() => { tick(); placeDock(); }, 500);
})();
</script>
</body>
</html>
